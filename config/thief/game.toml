# Private per-peer configuration - THIEF side.
# This file never crosses the network and is not signed.
# When config/game.json exists, its values OVERRIDE any parallel key here
# (a private file can never weaken a signed shared condition).
version = "1.00"

[game]
group_name = "YANELL11"
group_id = "yanell11"
sub_game_number = 1
members = ["NellKhoury", "YanalSerhan"]
repos = { cop = "https://github.com/Nell-Kh/police-thief-p2p", thief = "https://github.com/Nell-Kh/police-thief-p2p" }

[network]
my_port = 8802                                 # MY MCP server port (thief)
opponent_url = "http://127.0.0.1:8801/mcp"     # the only thing I know about the opponent
turn_timeout_seconds = 180

[strategy]
# The competition brain: open-field evasion blending region, distance, openness,
# mobility (see notebooks/analysis.ipynb). Survives 60/72 vs the region cop where
# the enhanced thief survived 0; still survives everything pursuit-style.
thief_class = "police_thief.domain.brain.evade:EvadeThiefBrain"

[interop]
# Which of two lawful readings of the book we speak on the wire. Four places -
# the commit seal, the scent clamp, the settlement serialization and the signed
# terms shape - have a kit reading and a book reading, and BOTH are defensible
# under the rulebook's academic-freedom clause. Picking one silently is the
# failure: two lawful peers that disagree each conclude the other forged its
# log, and rules #19/#35 then score both teams zero.
#
#   kit  - the class interop kit (copthief-league-protocol) and the reference
#          peer it pins. Our 14 vendored vectors pass byte-for-byte under it.
#   book - the printed formulae of ch. 4.3 and ch. 5.3.1, literally.
#
# Declared at the handshake beside the locked-model hashes, so a mismatch
# refuses before kickoff instead of surfacing as a mutual zero at the audit.
# See docs/REVIEW_HOSTILE.md H0-H4 and README.md section 8.
profile = "kit"

# Series tie: does the App. F award ADD to the accumulated sub-game totals, or
# REPLACE them? The book is ambiguous and the kit does NOT settle it - its
# report_consensus vector pins the serialization and says nothing about
# aggregate semantics - so this forks the settlement hash under either dialect.
# Declared separately for that reason. "add" is the reading this project has
# always used; agree it with the opponent before a counted series.
tie_award = "add"

[deception]
# The cop's capture claims reveal its belief every turn. Adaptive: while the
# claims wander, feed directional lies; once they land close, go vague -
# against a scent-verifier, silence is the only unfalsifiable hint.
mode = "adaptive"
tracked_gap = 2
window = 3

[trash_talk]
# How the banter/deception text is produced. The MOVE is always pure Python.
provider = "claude_api"
every_n_steps = 3

[llm]
model = "claude-haiku"
step_deadline_seconds = 30

[email]
# The binding league address (rule #51, App. F variables table). This is NOT a
# preference: report_blocks._is_armed() refuses to arm `counted` for any other
# recipient, so a report addressed anywhere else scores nothing however well the
# series went. It previously pointed at a team member's own inbox, which meant
# every game we played was silently reported as a friendly.
recipient = "rmisegal+uoh26finalgame@gmail.com"

# draft = build and park in Gmail Drafts; send = actually deliver.
# Committed as `draft` on purpose: the repository's resting state is the
# rehearsal state, so no demo, sparring run or accidental invocation can mail
# the lecturer. Flip to "send" as a deliberate step when starting a COUNTED
# series (docs/TODO.md 11.3.2) and flip it back afterwards.
mode = "draft"
